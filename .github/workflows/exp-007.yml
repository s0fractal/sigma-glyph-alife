name: exp-007

# The soup replay is a ten-minute job, so it runs only when the experiment
# changes. The cheap half — every control, including the one that proves the core
# algorithm returns nothing on an open chain — runs on every push inside
# `substrate`. A green pull request that never executes the artifact it is green
# about is the shape of defect sigma-glyph's exp-004 workflow exists to prevent,
# and this is its copy.
#
# Prose and receipts are excluded from the trigger: RESULT.md's claims are checked
# by the numbers, not by its bytes.
on:
  push:
    branches: [master]
    paths: ['experiments/alife-exp-007/**', '!experiments/alife-exp-007/**.md',
            '.github/workflows/exp-007.yml']
  pull_request:
    paths: ['experiments/alife-exp-007/**', '!experiments/alife-exp-007/**.md',
            '.github/workflows/exp-007.yml']

env:
  SIGMA_GLYPH_PIN: d3f1b512a967b9c50111684efa512a48fce9ef8d

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - name: Fetch the pinned Book I oracle
        run: |
          set -euo pipefail
          git clone -q https://github.com/s0fractal/sigma-glyph /tmp/sigma-glyph
          git -C /tmp/sigma-glyph checkout -q "$SIGMA_GLYPH_PIN"
          sha256sum /tmp/sigma-glyph/impl/sigma_glyph.py
      - name: Replay the soup; the committed receipt must be what it derives
        env:
          SIGMA_GLYPH: /tmp/sigma-glyph/impl
        run: |
          python3 experiments/alife-exp-007/measure.py --record | tail -20
          git diff --exit-code experiments/alife-exp-007/results.json
